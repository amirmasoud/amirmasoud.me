title = "Amirmasoud"
baseURL = "https://amirmasoud.me"
languageCode = 'en-us'
theme = 'ananke'
enableRobotsTXT = true

[sitemap]
changefreq = "monthly"
priority = 0.5
filename = "sitemap.xml"

[outputFormats.MoviesJSON]
mediaType = "application/json"
baseName = "movies"
isPlainText = true
notAlternative = true

[outputs]
home = ["HTML", "RSS", "MoviesJSON"]

[params]
featured_image_class = "contain bg-top bg-black"
recent_posts_number = 10
recent_copy = " "

[params.ananke.social.share]
networks = [
  "email"
]

[params.ananke.social.follow]
new_window_icon = true
networks = [
  "linkedin",
  "github",
  "youtube"
]

[params.ananke.social.linkedin]
username = "amirmasoud-sheidayi"

[params.ananke.social.github]
username = "amirmasoud"

[params.ananke.social.youtube]
username = "Amirmasoud32"

[module]
  [[module.imports]]
    path = 'github.com/hugomods/images'
  # Setting any [[module.mounts]] drops Hugo's implicit defaults, so they're
  # restated below. Last entry re-mounts static/ under assets/ so its images
  # are resizable via Hugo Pipes without affecting the normal static passthrough.
  [[module.mounts]]
    source = "static"
    target = "static"
  [[module.mounts]]
    source = "content"
    target = "content"
  [[module.mounts]]
    source = "layouts"
    target = "layouts"
  [[module.mounts]]
    source = "data"
    target = "data"
  [[module.mounts]]
    source = "assets"
    target = "assets"
  [[module.mounts]]
    source = "i18n"
    target = "i18n"
  [[module.mounts]]
    source = "archetypes"
    target = "archetypes"
  [[module.mounts]]
    source = "static"
    target = "assets/static"
